<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Näppäinaapinen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@500;600;700;800&display=swap">
<meta name="description" content="Näppäinaapinen – lasten kirjain- ja näppäinleikki: vapaa leikki, kirjainten etsintä, sanat, lumisade ja Sormikoulu.">
<meta name="theme-color" content="#D3E7F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C172E" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Aapinen">
<style>
/* Layout: one-screen toy. Top bar (name · player · prizes · sound · menu) over mode tabs, stat chips,
   a stage with a Lapland fell scenery (sun by day, aurora by night) where a wooden ABC block,
   word tiles, falling snowflakes or two finger-coloured hands appear, and the Finnish ISO keyboard
   mirrored at the bottom with staggered rows. */
:root{
  --bg:#D3E7F5;
  --glow-a:#F6FBFF;
  --glow-b:#FFEFC2;
  --surface:#FAFDFF;
  --surface-2:#E2EEF8;
  --ink:#14243C;
  --muted:#485C79;
  --line:#A8C1D7;
  --shadow:rgba(20,36,60,.20);
  --rim:rgba(255,255,255,.30);
  --t1:#DE4336; --t2:#F2AE1C; --t3:#2F9C52; --t4:#2A6ECB; --t5:#8253CF; --t6:#E97325;
  --on-toy:#FFFFFF;
  --on-yellow:#2A1B00;
  --ok:#2C9850;
  --warn:#D4433A;
  --snow:#FFFFFF;
  /* sormet: pikkusormi, nimetön, keskisormi, etusormi, peukalo */
  --fp:#D2468F; --fr:#2F7BD0; --fm:#159A85; --fi:#EE8420; --ft:#7D8AA0;
  /* maisema */
  --fell-far:#BCD6EA; --fell-near:#E8F3FB; --fell-cap:#FFFFFF;
  --sun:#FFE08A; --sun-o:.85; --cloud:#FFFFFF; --cloud-o:.75;
  --aur-a:#3EE0A0; --aur-b:#8A6BFF; --aurora-o:0;
  /* esineet, samat molemmissa teemoissa */
  --dyn-a:#C8372D; --dyn-b:#A92B22; --dyn-band:#6E4A2A; --dyn-label:#F6E7C8;
  --fuse:#9A7B55; --spark:#FFE066; --spark-glow:#FF8A1F;
  --flash:#FFF6DA;
  --kukko-body:#FFFDF6; --kukko-line:#2B2B3A; --kukko-leg:#E8A21E;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --letter:"Andika","Verdana",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C172E; --glow-a:#14504B; --glow-b:#33265E; --surface:#16264A; --surface-2:#0F1E3A;
    --ink:#E9F1FF; --muted:#9CB0D2; --line:#2C4372; --shadow:rgba(0,0,0,.45); --rim:rgba(255,255,255,.20);
    --t1:#FF6555; --t2:#FFC63C; --t3:#4CC473; --t4:#5A99F2; --t5:#A67FF3; --t6:#FF9349;
    --on-toy:#0C172E; --on-yellow:#2A1B00; --ok:#47C06C; --warn:#FF6B5D; --snow:#CFDDF0;
    --fp:#F06AAE; --fr:#5C9DF0; --fm:#33C4AC; --fi:#FFA04A; --ft:#9AA6BC;
    --fell-far:#152646; --fell-near:#1C3054; --fell-cap:#2E4A78;
    --sun-o:0; --cloud-o:0; --aurora-o:.55;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C172E; --glow-a:#14504B; --glow-b:#33265E; --surface:#16264A; --surface-2:#0F1E3A;
  --ink:#E9F1FF; --muted:#9CB0D2; --line:#2C4372; --shadow:rgba(0,0,0,.45); --rim:rgba(255,255,255,.20);
  --t1:#FF6555; --t2:#FFC63C; --t3:#4CC473; --t4:#5A99F2; --t5:#A67FF3; --t6:#FF9349;
  --on-toy:#0C172E; --on-yellow:#2A1B00; --ok:#47C06C; --warn:#FF6B5D; --snow:#CFDDF0;
  --fp:#F06AAE; --fr:#5C9DF0; --fm:#33C4AC; --fi:#FFA04A; --ft:#9AA6BC;
  --fell-far:#152646; --fell-near:#1C3054; --fell-cap:#2E4A78;
  --sun-o:0; --cloud-o:0; --aurora-o:.55;
  color-scheme:dark;
}

[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{
  height:100%;margin:0;overflow:hidden;
  background:
    radial-gradient(120% 55% at 28% -14%, var(--glow-a), transparent 62%),
    radial-gradient(70% 45% at 94% -8%, var(--glow-b), transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:var(--display);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
}
:focus-visible{outline:3px solid var(--t4);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
input{-webkit-user-select:text;user-select:text}

.app{height:100%;display:flex;flex-direction:column;max-width:1100px;margin-inline:auto}

/* ---------- yläpalkki ---------- */
.bar{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 12px;padding-block:10px 4px}
.brand{display:flex;align-items:center;gap:6px;min-width:0}
.brand .logo{width:34px;height:34px;flex:none}
.brand .logo svg{width:100%;height:100%;display:block}
.brand h1{margin:0;font:800 clamp(20px,2.4vw,26px)/1 var(--display);letter-spacing:-.01em;white-space:nowrap}
.brand h1 span{color:var(--t1)}
.modes{grid-column:1 / -1;grid-row:2;justify-self:center;display:flex;gap:2px;padding:4px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);max-width:100%}
.modes button{border:0;background:transparent;color:var(--muted);font:700 15px/1 var(--display);padding:9px 13px;border-radius:999px;cursor:pointer;white-space:nowrap}
.modes button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.modes .s{display:none}
.tools{grid-column:2;grid-row:1;display:flex;gap:6px;justify-content:flex-end;align-items:center}
.tool{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--surface);color:var(--ink);font:700 14px/1 var(--display);padding:7px 10px;border-radius:999px;cursor:pointer;min-height:36px}
.tool[aria-pressed="false"].mute{opacity:.6}
.tool svg,.mi svg{width:18px;height:18px;flex:none;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.tool .nm{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tool .cnt{font-variant-numeric:tabular-nums}
.tool.icon{padding:7px 9px}

/* ---------- laskuri ---------- */
.stats{display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;gap:8px;padding-block:6px}
.chip{display:flex;flex-direction:column;justify-content:center;min-width:72px;padding:4px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.chip .k{font:700 11px/1.3 var(--display);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.chip .v{font:800 22px/1.15 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.wide{min-width:140px}
.chip.low .v{color:var(--warn)}
.meter{display:block;height:6px;margin-top:3px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--t1),var(--t6),var(--t2),var(--t3),var(--t4),var(--t5));transition:width .3s}
.meter.fuse i{background:linear-gradient(90deg,var(--fuse),var(--t6),var(--t1))}
.btn{border:2px solid var(--line);background:var(--surface);color:var(--ink);font:700 15px/1 var(--display);padding:10px 16px;border-radius:999px;cursor:pointer}
.btn.small{align-self:center;font-size:14px;padding:8px 12px}
.linkbtn{border:0;background:none;color:var(--t4);font:700 14px var(--display);text-decoration:underline;cursor:pointer;padding:4px}

/* ---------- näyttämö ja maisema ---------- */
.stage{position:relative;flex:1 1 auto;min-height:0;container-type:size}
.scenery{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;border-radius:18px}
.fells{position:absolute;left:0;bottom:0;width:100%;height:26%}
.fells .far{fill:var(--fell-far)}
.fells .cap{fill:none;stroke:var(--fell-cap);stroke-width:3;stroke-linecap:round}
.fells .near{fill:var(--fell-near)}
.sun{position:absolute;top:7%;right:6%;width:clamp(40px,12cqmin,90px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle, var(--sun) 0 52%, transparent 72%);opacity:var(--sun-o)}
.cloud{position:absolute;left:-30%;height:clamp(16px,5cqh,36px);width:clamp(70px,20cqw,170px);border-radius:999px;background:var(--cloud);opacity:var(--cloud-o);filter:blur(2px);animation:cloud 70s linear infinite}
.cloud.c1{top:11%}
.cloud.c2{top:22%;animation-duration:95s;animation-delay:-40s;width:clamp(50px,14cqw,120px)}
@keyframes cloud{to{translate:150cqw 0}}
.aurora{position:absolute;inset:0 0 35% 0;opacity:var(--aurora-o)}
.aurora i{position:absolute;top:-25%;width:70%;height:75%;border-radius:50%;filter:blur(34px);animation:aur 17s ease-in-out infinite alternate}
.aurora i:nth-child(1){left:-12%;background:radial-gradient(closest-side, var(--aur-a), transparent)}
.aurora i:nth-child(2){left:28%;top:-12%;background:radial-gradient(closest-side, var(--aur-b), transparent);animation-duration:23s}
.aurora i:nth-child(3){left:52%;top:-30%;background:radial-gradient(closest-side, var(--aur-a), transparent);animation-duration:19s}
@keyframes aur{from{transform:translateX(-7%) scaleY(.8)}to{transform:translateX(9%) scaleY(1.18)}}

#snow{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.center{position:absolute;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(6px,3cqh,18px);text-align:center;pointer-events:none}
.center > *{pointer-events:auto}
body[data-mode="snow"] .center{justify-content:flex-start;padding-top:6px;z-index:2}
body[data-mode="snow"] .prompt{font-size:14px;opacity:.85}
.prompt{margin:0;font:700 clamp(15px,4.5cqh,24px)/1.2 var(--display);color:var(--muted);text-wrap:balance;max-width:92%}
.focus-pill{display:none;font:700 14px/1 var(--display);background:var(--t2);color:var(--on-yellow);padding:7px 12px;border-radius:999px}
body.nofocus .focus-pill{display:inline-block}

/* kirjainpalikka */
.lv{display:flex;flex-direction:column;align-items:center;gap:clamp(8px,3cqh,20px)}
.block{
  --c:var(--t4);--oc:var(--on-toy);
  --size:clamp(104px, min(34vh, 60vw), 260px);
  --size:clamp(96px, 50cqmin, 270px);
  position:relative;width:var(--size);height:var(--size);max-width:100%;
  display:grid;place-items:center;border-radius:20%;
  background:var(--c);color:var(--oc);
  box-shadow:
    inset 0 0 0 calc(var(--size) * .05) var(--rim),
    0 calc(var(--size) * .06) 0 color-mix(in srgb, var(--c) 60%, #000),
    0 calc(var(--size) * .1) calc(var(--size) * .2) var(--shadow);
  transform:rotate(var(--r,0deg));
}
.block .up{font:700 calc(var(--size) * .6)/1 var(--letter);transform:translateY(-3%)}
.block .low{position:absolute;right:13%;bottom:8%;font:700 calc(var(--size) * .2)/1 var(--letter);opacity:.85}
.block .fdot{position:absolute;left:11%;bottom:10%;width:calc(var(--size) * .1);height:calc(var(--size) * .1);border-radius:50%;background:var(--fc);box-shadow:0 0 0 3px var(--rim)}
.word{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:.15em .4em;max-width:94cqw;min-height:1.3em;font:700 clamp(22px,8cqh,48px)/1.1 var(--letter)}
.word .em{font-size:1.2em;line-height:1}
.word .em.count{flex-basis:100%;font-size:.85em;letter-spacing:.04em}
.word b{color:color-mix(in srgb, var(--c) 78%, var(--ink))}
.word .note{font:600 .62em/1.2 var(--display);color:var(--muted)}

/* sanat */
.wv{display:flex;flex-direction:column;align-items:center;gap:clamp(6px,2.4cqh,18px);max-width:100%}
.race-cap{font:700 12px/1.2 var(--display);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.race{position:relative;width:min(520px,92cqw);display:grid;gap:3px;padding-right:22px}
.lane{position:relative;height:clamp(16px,5.5cqh,26px);border-bottom:2px dashed var(--line)}
.car{position:absolute;left:0;bottom:1px;height:100%;aspect-ratio:40/22;transition:transform .25s linear}
.car svg{display:block;width:100%;height:100%}
.car.me path{fill:var(--t1)}
.car.me circle{fill:var(--ink)}
.car.ghost svg{opacity:.75}
.car.ghost path,.car.ghost circle{fill:none;stroke:var(--muted);stroke-width:1.8;stroke-dasharray:3 2}
.flag{position:absolute;right:0;top:0;bottom:2px;width:14px;border-radius:2px;background:conic-gradient(var(--ink) 25%, var(--surface) 0 50%, var(--ink) 0 75%, var(--surface) 0) 0 0 / 10px 10px}
.wemoji{font-size:clamp(46px,22cqh,130px);line-height:1;transform:rotate(var(--r,0deg))}
.tiles{--n:6;display:flex;flex-wrap:wrap;justify-content:center;gap:8px 14px;max-width:100%}
.grp{display:flex;gap:6px}
.tile{
  --tw:clamp(22px, min(calc((100cqw - 24px) / var(--n) - 6px), 14cqh), 60px);
  width:var(--tw);height:calc(var(--tw) * 1.12);display:grid;place-items:center;
  border-radius:22%;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);
  font:700 calc(var(--tw) * .6)/1 var(--letter);color:var(--ink);
  transition:transform .12s, background-color .12s;
}
.tile.sp{color:var(--muted);font-size:calc(var(--tw) * .42)}
.tile.cur{border-color:var(--t4);box-shadow:0 5px 0 var(--t4);transform:translateY(-5px)}
.tile.done{background:var(--ok);color:var(--on-toy);border-color:transparent;box-shadow:0 3px 0 color-mix(in srgb, var(--ok) 60%, #000)}

/* sormikoulu */
.lsn{display:flex;flex-direction:column;align-items:center;gap:clamp(4px,2cqh,14px);width:100%}
.lsn-top{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 10px;font:700 clamp(13px,3.6cqh,18px)/1.2 var(--display);color:var(--muted)}
.dots{display:flex;gap:5px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.done{background:var(--ok)}
.dots i.now{background:var(--t4);box-shadow:0 0 0 3px color-mix(in srgb, var(--t4) 30%, transparent)}
.line{--lw:clamp(22px, min(8cqh, 5.6cqw), 40px);display:flex;gap:4px;justify-content:center;min-height:calc(var(--lw) * 1.5);align-items:center}
.lc{width:var(--lw);height:calc(var(--lw) * 1.2);display:grid;place-items:center;flex:none;border-radius:8px;font:700 calc(var(--lw) * .66)/1 var(--letter);color:var(--ink);background:var(--surface);border:2px solid var(--line);transition:transform .1s}
.lc.sp{color:var(--muted);font-size:calc(var(--lw) * .42)}
.lc.d{opacity:.4;background:transparent;border-color:transparent}
.lc.c{background:color-mix(in srgb, var(--fc) 30%, var(--surface));border-color:var(--fc);box-shadow:0 4px 0 var(--fc);transform:translateY(-4px) scale(1.12)}
.lc.x{background:color-mix(in srgb, var(--warn) 28%, var(--surface));border-color:var(--warn)}
.fl{display:inline-flex;align-items:center;gap:8px;font:700 clamp(14px,4cqh,20px)/1 var(--display);min-height:1.2em}
.fl i{width:14px;height:14px;border-radius:50%;background:var(--fc);flex:none}
.hands{height:clamp(84px,46cqh,260px);width:auto;max-width:94cqw;overflow:visible}
.hands .palm{fill:var(--surface);stroke:var(--muted);stroke-width:2.5}
.hands .fgr{fill:color-mix(in srgb, var(--fc) 26%, var(--surface));stroke:var(--muted);stroke-width:2.5}
.hands .fk{font:700 17px var(--letter);fill:var(--ink);text-anchor:middle;dominant-baseline:central;opacity:.75}
.hands .bump{fill:var(--ink);opacity:.5}
.hands .fg{transform-box:fill-box;transform-origin:50% 100%}
.hands .fg.on .fgr{fill:var(--fc);filter:url(#glow)}
.hands .fg.on .fk{fill:var(--on-toy);opacity:1}
.hands .fg.on{animation:tap .7s ease-in-out infinite}
.hands .tip circle{fill:var(--fc);stroke:var(--surface);stroke-width:3}
.hands .tip text{font:700 19px var(--letter);fill:var(--on-toy);text-anchor:middle;dominant-baseline:central}
@keyframes tap{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

/* kukko */
.mascot{position:absolute;left:6px;bottom:4px;z-index:2;width:clamp(44px,15cqh,92px);aspect-ratio:1;pointer-events:none}
.mascot svg,.kukko-card svg{width:100%;height:100%;display:block;transform-origin:50% 100%}
.mascot.hop svg{animation:mhop .38s ease-out}
.mascot.no svg{animation:mno .42s ease-in-out}
.mascot.cheer svg{animation:mcheer .9s ease-in-out}
@keyframes mhop{0%,100%{transform:translateY(0)}45%{transform:translateY(-22%) scale(1.03,.97)}}
@keyframes mno{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
@keyframes mcheer{0%,100%{transform:translateY(0) scale(1)}20%{transform:translateY(-30%) scale(1.08)}40%{transform:translateY(0) scale(1.12,.9)}60%{transform:translateY(-18%) scale(1.04)}}
.mbubble{position:absolute;left:92%;bottom:78%;white-space:nowrap;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:14px 14px 14px 4px;padding:5px 10px;font:700 14px/1.2 var(--display);box-shadow:0 4px 12px var(--shadow)}
body[data-mode="snow"] .mascot{bottom:8px}
body[data-mode="lesson"] .mascot{display:none}
.kukko-card{width:64px;height:64px;margin:0 auto 2px}

.pop{animation:pop .42s cubic-bezier(.25,1.7,.45,1) both}
@keyframes pop{from{transform:scale(.45) rotate(calc(var(--r,0deg) * -3))}to{transform:scale(1) rotate(var(--r,0deg))}}
.shake{animation:shake .36s ease-in-out}
@keyframes shake{
  0%,100%{transform:translateX(0) rotate(var(--r,0deg))}
  20%{transform:translateX(-12px) rotate(var(--r,0deg))}
  40%{transform:translateX(11px) rotate(var(--r,0deg))}
  60%{transform:translateX(-7px) rotate(var(--r,0deg))}
  80%{transform:translateX(5px) rotate(var(--r,0deg))}
}

/* dynamiitti */
.dyn{position:absolute;z-index:2;bottom:4px;width:clamp(56px,24cqh,112px);aspect-ratio:120/178;max-width:100%;pointer-events:none;transform-origin:50% 100%}
.dyn svg{display:block;width:100%;height:100%;overflow:visible}
.dyn .fuse{fill:none;stroke:var(--fuse);stroke-width:4;stroke-linecap:round}
.dyn .label{font:800 9px var(--display);fill:var(--dyn-label);letter-spacing:.5px}
.dyn.drop{animation:drop .75s cubic-bezier(.4,0,.6,1) both}
.dyn.burn svg{animation:wob .16s ease-in-out infinite alternate;transform-origin:50% 100%}
@keyframes drop{
  0%{transform:translateY(-120cqh) rotate(-24deg)}
  62%{transform:translateY(0) rotate(6deg)}
  78%{transform:translateY(-10%) rotate(-3deg)}
  100%{transform:translateY(0) rotate(0)}
}
@keyframes wob{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
.flash{position:absolute;inset:0;z-index:5;background:var(--flash);opacity:0;pointer-events:none}
.flash.go{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
.boom{position:absolute;left:50%;top:42%;z-index:6;pointer-events:none;white-space:nowrap;
  font:800 clamp(48px,22cqmin,140px)/1 var(--display);color:var(--t2);
  -webkit-text-stroke:3px var(--t1);paint-order:stroke fill;text-shadow:0 6px 0 var(--t1);
  transform:translate(-50%,-50%)}
.boom.go{animation:boom .9s ease-out forwards}
@keyframes boom{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-8deg)}
  15%{opacity:1;transform:translate(-50%,-50%) scale(1.15) rotate(-4deg)}
  70%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-3deg)}
  100%{opacity:0;transform:translate(-50%,-62%) scale(1.05) rotate(-3deg)}
}
.quake{animation:quake .5s}
@keyframes quake{
  0%,100%{transform:translate(0,0)}
  10%{transform:translate(-8px,4px)} 20%{transform:translate(7px,-5px)} 30%{transform:translate(-6px,-3px)}
  40%{transform:translate(5px,5px)} 55%{transform:translate(-4px,2px)} 70%{transform:translate(3px,-2px)} 85%{transform:translate(-2px,1px)}
}

/* ilmoitukset */
.toasts{position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:7;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:max-content;max-width:92%}
.toast{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;border-radius:14px;background:var(--ink);color:var(--bg);font:700 15px/1.2 var(--display);box-shadow:0 8px 20px var(--shadow);animation:toastIn .3s cubic-bezier(.3,1.5,.5,1)}
.toast .te{font-size:26px;line-height:1}
.toast .stk-t{width:44px;height:44px;flex:none;border-radius:50%;background:#FFFFFF;display:grid;place-items:center;font-size:26px;box-shadow:0 0 0 3px #FFFFFF;animation:peel .7s cubic-bezier(.3,1.6,.5,1)}
.toast small{font:700 11px/1 var(--display);letter-spacing:.07em;text-transform:uppercase;opacity:.75}
.toast.out{opacity:0;transform:translateY(-8px);transition:opacity .25s, transform .25s}
@keyframes toastIn{from{opacity:0;transform:translateY(-14px) scale(.9)}to{opacity:1;transform:none}}
@keyframes peel{from{transform:rotate(-50deg) scale(.2)}to{transform:rotate(-6deg) scale(1)}}

/* päällyskortit */
.overlay{position:absolute;inset:0;z-index:3;display:grid;place-items:center;padding:10px;background:color-mix(in srgb, var(--bg) 72%, transparent);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.card{width:min(440px,100%);max-height:100%;overflow:auto;padding:18px 20px 16px;border-radius:22px;background:var(--surface);border:2px solid var(--line);box-shadow:0 14px 34px var(--shadow);text-align:center;-webkit-user-select:none;user-select:none}
.card.wide{width:min(640px,100%)}
.card .mascot-e{font-size:52px;line-height:1;margin-bottom:4px}
.card h2{margin:0 0 6px;font:800 clamp(22px,4vw,30px)/1.1 var(--display);text-wrap:balance}
.card h3{margin:16px 0 8px;font:800 18px/1.2 var(--display);text-align:left;display:flex;justify-content:space-between;gap:8px}
.card h3 small{font:700 14px var(--display);color:var(--muted)}
.card p{margin:0 0 12px;font:500 17px/1.4 var(--display);color:var(--muted);text-wrap:pretty}
.card p strong{color:var(--ink)}
.card .fine{margin:8px 0 6px;font-size:14px}
.res{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:4px 0 12px}
.res .chip{min-width:88px}
.acts{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.big{border:0;cursor:pointer;font:800 20px/1 var(--display);padding:14px 26px;border-radius:999px;background:var(--t3);color:var(--on-toy);box-shadow:0 4px 0 color-mix(in srgb, var(--t3) 58%, #000)}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb, var(--t3) 58%, #000)}
.big:disabled{opacity:.4;cursor:default;transform:none}
.stars{display:flex;justify-content:center;gap:6px;font-size:42px;line-height:1;margin:2px 0 10px}
.stars .on{color:var(--t2);text-shadow:0 3px 0 color-mix(in srgb, var(--t2) 55%, #000)}
.stars .off{color:var(--line)}
.lvl{display:flex;align-items:center;justify-content:center;gap:12px;margin:2px 0 10px}
.lvl .arrow{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);font:800 24px/1 var(--display);cursor:pointer}
.lvl .arrow:disabled{opacity:.3;cursor:default}
.lvl .info{display:flex;flex-direction:column;min-width:150px}
.lvl strong{font:800 24px/1.1 var(--display)}
.lvl .nm{font:700 15px/1.3 var(--display);color:var(--muted)}
.lvl .mini{font-size:18px;letter-spacing:3px;color:var(--t2)}
.namebox{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:5px;min-height:56px;margin:6px 0 2px}
.nt{--c:var(--t4);--oc:var(--on-toy);width:clamp(30px,9vw,44px);height:clamp(34px,10vw,50px);border-radius:22%;display:grid;place-items:center;background:var(--c);color:var(--oc);font:700 clamp(18px,5.5vw,28px)/1 var(--letter);box-shadow:0 3px 0 color-mix(in srgb, var(--c) 60%, #000)}
.nsp{width:12px}
.caret{width:4px;height:40px;border-radius:2px;background:var(--ink);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.players{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.pchip{border:2px solid var(--line);background:var(--surface-2);color:var(--ink);font:700 15px/1 var(--display);padding:8px 12px;border-radius:999px;cursor:pointer}
.plist{list-style:none;margin:6px 0 14px;padding:0;display:grid;gap:6px;text-align:left}
.plist li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:12px;background:var(--surface-2);font:700 16px var(--display)}
.plist .armed{background:var(--warn);color:var(--on-toy);border-color:transparent}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:0 0 6px;text-align:left}
.badge{display:flex;flex-direction:column;gap:3px;padding:10px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line)}
.badge .be{font-size:28px;line-height:1}
.badge b{font:700 15px/1.2 var(--display)}
.badge span{font:500 13px/1.3 var(--display);color:var(--muted)}
.badge.locked .be{filter:grayscale(1);opacity:.35}
.badge.got{background:color-mix(in srgb, var(--t2) 22%, var(--surface));border-color:color-mix(in srgb, var(--t2) 60%, var(--line))}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:24px 12px;margin:4px 0 22px;padding-inline:4px}
.stk{aspect-ratio:1;display:grid;place-items:center;border-radius:50%;position:relative}
.stk.on{background:#FFFFFF;box-shadow:0 0 0 4px #FFFFFF,0 4px 12px var(--shadow);transform:rotate(var(--rot,0deg))}
.stk.on span{font-size:clamp(26px,7vw,36px);line-height:1}
.stk.on b{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%) rotate(calc(var(--rot,0deg) * -1));font:700 11px/1 var(--display);color:var(--muted);white-space:nowrap}
.stk.off{border:2px dashed var(--line);color:var(--line);font:800 20px var(--display)}
.prog{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:6px;text-align:left}
.prog li{padding:8px 12px;border-radius:12px;background:var(--surface-2);font:600 15px/1.3 var(--display)}
.menu{display:grid;gap:8px;margin:6px 0 14px}
.mi{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);font:700 16px/1.2 var(--display);text-align:left;cursor:pointer}
.mi svg{width:22px;height:22px}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin:6px 0 12px}
.lsb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);cursor:pointer;font-family:var(--display)}
.lsb b{font:800 20px/1 var(--display)}
.lsb span{font:700 13px/1.2 var(--letter)}
.lsb i{font-style:normal;font-size:13px;color:var(--t2);letter-spacing:1px;min-height:1.2em}
.lsb.sel{border-color:var(--t4);background:color-mix(in srgb, var(--t4) 16%, var(--surface));box-shadow:0 3px 0 var(--t4)}
.lsb:disabled{opacity:.45;cursor:default}
.chk{display:inline-flex;align-items:center;gap:8px;font:700 15px var(--display);color:var(--ink);margin:0 0 12px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--t4)}
.posture{list-style:none;margin:6px 0 10px;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:6px;text-align:left}
.posture li{display:grid;grid-template-columns:28px 1fr;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;background:var(--surface-2);font:500 14px/1.3 var(--display)}
.posture li b{color:var(--ink)}
.posture .ic{font-size:22px;text-align:center}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;margin:0 0 12px;font:700 13px var(--display)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:4px;background:var(--fc)}
.qr{width:224px;height:224px;margin:0 auto 12px;padding:12px;border-radius:16px;background:#FFFFFF;display:grid;place-items:center;color:#14243C;font:600 14px/1.3 var(--display)}
.qr img,.qr canvas{width:200px;height:200px}
.url{width:100%;font:600 15px var(--display);padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);margin:4px 0 10px}
.diploma{border:6px double var(--t2);border-radius:18px;padding:18px 16px;margin-bottom:12px;background:radial-gradient(120% 80% at 50% 0%, color-mix(in srgb, var(--t2) 14%, var(--surface)), var(--surface))}
.diploma h2{font-size:clamp(28px,6vw,40px);letter-spacing:.06em;text-transform:uppercase;color:var(--t1)}
.diploma .dn{font:800 clamp(26px,6vw,38px)/1.1 var(--letter);color:var(--ink);margin:6px 0 4px}
.diploma ul{list-style:none;padding:0;margin:8px 0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.diploma li{background:var(--surface-2);border-radius:999px;padding:5px 12px;font:700 14px var(--display)}
.diploma .dd{font-size:14px;margin:6px 0 0}

/* ---------- näppäimistö ---------- */
.kb{--kg:5px;--kw:min(62px, calc((100% - 12 * var(--kg)) / 11.8));display:flex;flex-direction:column;gap:6px;padding-block:8px 12px;width:100%;overflow-x:clip;overflow-clip-margin:10px}
.row{display:flex;justify-content:center;gap:var(--kg)}
.row.r2{transform:translateX(calc((var(--kw) + var(--kg)) * .25))}
.row.r3{transform:translateX(calc((var(--kw) + var(--kg)) * -.25))}
.row.digits{transform:translateX(calc((var(--kw) + var(--kg)) * -1))}
.key{
  --c:var(--surface);--oc:var(--ink);--fc:var(--ft);
  position:relative;flex:0 0 auto;width:var(--kw);
  height:clamp(34px,6vh,54px);padding:0;
  border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  box-shadow:0 3px 0 var(--line);
  font:700 clamp(14px,2.4vh,22px)/1 var(--letter);
  cursor:pointer;touch-action:manipulation;transition:transform .08s, box-shadow .08s;
}
.key.sym{color:var(--muted)}
.key[data-k="F"]::after,.key[data-k="J"]::after{content:"";position:absolute;left:50%;bottom:15%;width:26%;height:3px;border-radius:2px;background:currentColor;opacity:.55;transform:translateX(-50%)}
.row.digits .key{font-family:var(--display);font-weight:800}
.key.fn{width:auto;min-width:var(--kw);padding-inline:12px;font:700 clamp(13px,2.1vh,18px)/1 var(--display);background:var(--surface-2)}
.key.space{flex:0 1 auto;width:calc(var(--kw) * 6 + var(--kg) * 5);min-width:56px}
.key.ok{background:var(--t3);color:var(--on-toy);border-color:transparent;box-shadow:0 3px 0 color-mix(in srgb, var(--t3) 58%, #000)}
.key.found{background:var(--c);color:var(--oc);border-color:transparent;box-shadow:0 3px 0 color-mix(in srgb, var(--c) 60%, #000)}
.kb.fingers .key[data-f]{background:color-mix(in srgb, var(--fc) 24%, var(--surface));border-color:color-mix(in srgb, var(--fc) 45%, var(--line));box-shadow:0 3px 0 color-mix(in srgb, var(--fc) 70%, var(--line))}
.kb.fingers .key.found[data-f]{color:var(--ink)}
.kb.fingers .key.found::before{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--c)}
.kb.blind .key[data-f]:not(.fn){color:transparent}
.kb.blind .key[data-k="F"]::after,.kb.blind .key[data-k="J"]::after{background:var(--ink)}
.kb .key.hint[data-k]{background:var(--t2);color:var(--on-yellow);border-color:transparent;animation:glow 1s ease-in-out infinite}
.kb .key.target[data-k]{background:var(--fc);color:var(--on-toy);border-color:transparent;box-shadow:0 3px 0 color-mix(in srgb, var(--fc) 60%, #000), 0 0 0 4px color-mix(in srgb, var(--fc) 35%, transparent);animation:tgt 1s ease-in-out infinite}
.key.down{transform:translateY(3px);box-shadow:0 0 0 var(--line)}
@keyframes glow{
  0%,100%{box-shadow:0 3px 0 color-mix(in srgb, var(--t2) 60%, #000), 0 0 0 0 color-mix(in srgb, var(--t2) 60%, transparent)}
  50%{box-shadow:0 3px 0 color-mix(in srgb, var(--t2) 60%, #000), 0 0 0 7px color-mix(in srgb, var(--t2) 45%, transparent)}
}
@keyframes tgt{50%{transform:translateY(-2px)}}

/* ---------- v4: tavut, aikuisten osio, testi ---------- */
.word .sd{color:var(--muted);font-weight:400;margin:0 .03em}
.tile{position:relative}
.tile.sb{margin-left:12px}
.tile.sb::before{content:"·";position:absolute;left:-11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:calc(var(--tw) * .45)}
.seg{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:2px;padding:4px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);margin:0 0 12px}
.seg button{border:0;background:transparent;color:var(--muted);font:700 15px/1 var(--display);padding:9px 14px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 0 var(--line)}
a.big{display:inline-block;text-decoration:none}
.adult{text-align:left}
.adult h2{text-align:left}
.adult section{padding:12px 0;border-top:1px solid var(--line)}
.adult section:first-of-type{border-top:0;padding-top:4px}
.adult h3{margin:0 0 6px}
.adult .acts{justify-content:flex-start}
.field{display:grid;gap:4px;margin:0 0 10px}
.field label{font:700 13px/1.2 var(--display);color:var(--muted)}
.field input,.field textarea,.field select{font:600 16px/1.35 var(--display);padding:9px 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);width:100%;-webkit-user-select:text;user-select:text}
.field textarea{min-height:96px;resize:vertical;font-family:var(--letter)}
.row-opts{display:flex;flex-wrap:wrap;gap:4px 18px;margin:0 0 6px}
.row-opts .chk{margin:0 0 6px}
.gate{display:flex;justify-content:center;align-items:center;gap:8px;margin:6px 0 10px}
.gate input{width:130px;text-align:center;font:800 24px var(--display);padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);-webkit-user-select:text;user-select:text}
.support{padding:12px 14px;border-radius:14px;background:color-mix(in srgb, var(--t2) 16%, var(--surface));margin-top:8px}
.chart{width:100%;height:auto;display:block;margin:2px 0 6px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{font:600 11px var(--display);fill:var(--muted)}
.chart .ln{fill:none;stroke:var(--t4);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--t4);stroke:var(--surface);stroke-width:2}
.chart .lbl{font:700 13px var(--display);fill:var(--ink)}
.ttab{width:100%;border-collapse:collapse;font:600 14px var(--display);font-variant-numeric:tabular-nums;margin:0 0 12px}
.ttab th,.ttab td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right}
.ttab th:first-child,.ttab td:first-child{text-align:left}
.ttab th{font:700 11px var(--display);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.share-opt{margin:0 0 8px}

@media (min-width:1180px){
  .bar{grid-template-columns:auto 1fr auto}
  .modes{grid-column:2;grid-row:1}
  .tools{grid-column:3;grid-row:1}
}
@media (max-width:700px){
  .modes{justify-self:stretch}
  .modes button{flex:1 1 0;padding:9px 2px;font-size:13px}
  .modes .f{display:none}
  .modes .s{display:inline}
}
@media (max-width:560px){
  .brand h1{display:none}
  .tool{padding:7px 9px}
  .tool .nm{max-width:72px}
  #btnPlayer svg{display:none}
  .chip{min-width:58px;padding:3px 8px}
  .chip .k{font-size:10px;letter-spacing:.03em}
  .chip .v{font-size:18px}
  .chip.wide{min-width:96px}
  .stats{gap:6px}
  .kb{--kg:3px}
  .key{border-radius:7px}
  .key.fn{padding-inline:8px}
}
@media (prefers-reduced-motion: reduce){
  .pop,.shake,.dyn.drop,.dyn.burn svg,.quake,.boom.go,.caret,.cloud,.aurora i,.hands .fg.on,.mascot svg,.kb .key.target,.toast .stk-t{animation:none!important}
  .boom.go{opacity:1}
  .kb .key.hint[data-k]{animation:none;box-shadow:0 0 0 4px color-mix(in srgb, var(--t2) 55%, transparent)}
  .tile,.key,.meter i,.car,.lc{transition:none}
}
@media print{
  body{overflow:visible;background:#FFFFFF}
  body *{visibility:hidden}
  .diploma,.diploma *{visibility:visible}
  .diploma{position:fixed;inset:10mm;margin:0}
}
</style>
</head>
<body>

<div class="app">
  <header class="bar">
    <div class="brand"><span class="logo" id="logo" aria-hidden="true"></span><h1>Näppäin<span>aapinen</span></h1></div>
    <nav class="modes" role="tablist" aria-label="Pelitila">
      <button type="button" role="tab" data-mode="free" aria-selected="true"><span class="f">Vapaa leikki</span><span class="s">Vapaa</span></button>
      <button type="button" role="tab" data-mode="find" aria-selected="false"><span class="f">Etsi kirjain</span><span class="s">Etsi</span></button>
      <button type="button" role="tab" data-mode="words" aria-selected="false"><span class="f">Kirjoita sana</span><span class="s">Sanat</span></button>
      <button type="button" role="tab" data-mode="snow" aria-selected="false"><span class="f">Lumisade</span><span class="s">Lumi</span></button>
      <button type="button" role="tab" data-mode="lesson" aria-selected="false"><span class="f">Sormikoulu</span><span class="s">Sormet</span></button>
    </nav>
    <div class="tools">
      <button type="button" class="tool" id="btnPlayer" title="Vaihda pelaajaa">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span class="nm" id="playerName">Pelaaja</span>
      </button>
      <button type="button" class="tool" id="btnPrizes" title="Palkinnot" aria-label="Palkinnot">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="15" r="5"/><path d="M8.6 11.2 6 3h4l2 5 2-5h4l-2.6 8.2"/></svg><span class="cnt" id="prizeCount">0</span>
      </button>
      <button type="button" class="tool icon mute" id="btnSound" aria-pressed="true" aria-label="Äänet" title="Äänet">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11"/></svg>
      </button>
      <button type="button" class="tool icon" id="btnMenu" aria-label="Valikko" title="Valikko">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </header>

  <section class="stats" id="stats" aria-label="Laskuri"></section>

  <main class="stage" id="stage">
    <div class="scenery" aria-hidden="true">
      <div class="aurora"><i></i><i></i><i></i></div>
      <div class="sun"></div>
      <div class="cloud c1"></div><div class="cloud c2"></div>
      <svg class="fells" viewBox="0 0 1200 200" preserveAspectRatio="none">
        <path class="far" d="M0 200 L0 118 C 110 76, 210 62, 320 98 C 420 132, 480 66, 620 50 C 760 36, 830 104, 950 88 C 1050 74, 1120 60, 1200 78 L1200 200 Z"/>
        <path class="cap" d="M470 76 C 520 58, 570 50, 620 50 C 680 46, 720 60, 760 74 M 1050 74 C 1100 64, 1150 62, 1200 78"/>
        <path class="near" d="M0 200 L0 158 C 160 130, 260 120, 400 148 C 520 172, 640 120, 800 124 C 960 128, 1060 164, 1200 148 L1200 200 Z"/>
      </svg>
    </div>
    <canvas id="snow" aria-hidden="true" hidden></canvas>
    <div class="center">
      <p class="prompt" id="prompt">Paina mitä tahansa kirjainta tai numeroa</p>
      <span class="focus-pill">Napsauta ruutua, niin näppäimet toimivat</span>
      <div class="lv" id="letterView">
        <div class="block" id="block"><span class="up" id="bUp">A</span><span class="low" id="bLow">a</span><span class="fdot" id="bDot" hidden></span></div>
        <div class="word" id="word"><span class="em">🚗</span><span class="w"><b>A</b>UTO</span></div>
      </div>

  const flakeFont = (r) => `700 ${Math.round(r * 0.95)}px Andika, Verdana, sans-serif`;

  function previewFlakes() {

  const HANDS = {

    };

    s += '<g class="tip" id="tipShift" style="--fc:var(--fp)" hidden><circle r="15"/><text>⇧</text></g>';

  function setHands(f, ch, sf) {

  function input(ch, origin, loose) {
    audio(); activity();

      if (S.overlayKind === 'celebrate' && performance.now() >= S.overlayLock) hideOverlay();
      else return;
    }

    if (S.mode === 'free') doFree(ch, origin);

    else if (S.mode === 'snow') doSnow(ch);

  const spaceIsLetter = () => (S.mode === 'words' && S.w.running) || (S.mode === 'lesson' && S.l.running);
  function specialKey(k) {
    audio();
    if (S.naming) { if (k === 'BACK') nameBack(); else if (k === 'OK') nameOk(); else nameKey(k); return; }
    if (k === ' ') { if (spaceIsLetter()) input(' '); else spaceOrEnter(); }
  }
  function spaceOrEnter() {
    audio();
    if (S.naming) return;
    if (!overlay.hidden) {
      if (performance.now() < S.overlayLock) return;
      const k = S.overlayKind;
      if (k === 'start' || k === 'results') startRound();
      else if (k === 'snow-start' || k === 'snow-results') snowStart();
      else if (k === 'lesson-start') lessonStart('lesson');
      else if (k === 'lesson-results') { if (S.l.nextAvail) { S.l.lesson++; lessonStart('lesson'); } else lessonStart(S.l.weak ? 'weak' : 'lesson'); }
      else if (k === 'test-results') { lessonPreview(); lessonStartCard(); }
      else if (k === 'posture') act('posture-ok');
      else if (k === 'celebrate' || k === 'menu' || k === 'prizes' || k === 'diploma') { hideOverlay(); restoreCard(); }
      return;
    }
    if (S.mode === 'free') doFree(rand(ALPHA));
  }
  const CODE_FALLBACK = { Semicolon: 'Ö', Quote: 'Ä', BracketLeft: 'Å' };
  function keyToChar(e) {
    const k = e.key;
    if (k && k.length === 1) { const u = up(k); if (ALPHA.includes(u)) return u; if (isDigit(k)) return k; }
    if (e.code && CODE_FALLBACK[e.code]) return CODE_FALLBACK[e.code];
    if (e.code && /^Digit[0-9]$/.test(e.code)) return e.code.slice(5);
    return null;
  }
  window.addEventListener('keydown', (e) => {
    const t = e.target;
    if (t && t.matches && t.matches('input:not([type="checkbox"]), textarea, select')) return;
    if (e.key === 'Tab' || e.ctrlKey || e.metaKey || e.altKey) return;
    const onCtl = t && t.closest && t.closest('button, input, label, a');
    if (e.key === 'Escape') { if (!overlay.hidden && !['name', 'start', 'results', 'snow-start', 'snow-results', 'lesson-start', 'lesson-results', 'test-results'].includes(S.overlayKind)) { hideOverlay(); restoreCard(); } return; }
    if (S.naming) {
      if (e.key === 'Backspace') { e.preventDefault(); nameBack(); return; }
      if (e.key === 'Enter') { if (onCtl) return; e.preventDefault(); nameOk(); return; }
      if (e.key === ' ' || e.key === '-') { if (onCtl && e.key === ' ') return; e.preventDefault(); if (!e.repeat) { audio(); nameKey(e.key); } return; }
    }
    if (e.key === ' ' || e.key === 'Enter') {
      if (onCtl) return;
      e.preventDefault();
      if (e.repeat) return;
      if (e.key === ' ' && spaceIsLetter()) { input(' '); return; }
      spaceOrEnter();
      return;
    }
    if (S.mode === 'lesson' && S.l.running && !S.naming && overlay.hidden) {
      const k = e.key;
      if (k && k.length === 1 && /^[a-zåäö0-9.,\-]$/i.test(k)) { e.preventDefault(); if (!e.repeat) input(k); return; }
    }
    if (e.key === 'Backspace') { e.preventDefault(); return; }
    const ch = keyToChar(e); if (!ch) return;
    e.preventDefault();
    if (e.repeat) return;

  });

    input(rand(ALPHA), { x: e.clientX - s.left, y: e.clientY - s.top });
  });
  document.addEventListener('click', (e) => { const b = e.target.closest && e.target.closest('button'); if (b && e.detail > 0) b.blur(); });
  function focusState() { document.body.classList.toggle('nofocus', !document.hasFocus()); }
  window.addEventListener('focus', focusState); window.addEventListener('blur', focusState);

  /* =====================================================================
     TYÖKALUT
     ===================================================================== */
  function syncTools() { btnSound.setAttribute('aria-pressed', String(S.sound)); }
  function toggleCase() {
    S.upper = !S.upper; store.set('upper', S.upper);
    keyLabels(); renderView(); relabelHands();
    if (S.mode === 'words' && S.w.cur) renderTiles();
    if (S.mode === 'snow' && !S.s.running) drawSnow(previewFlakes());
    if (S.mode === 'lesson') { renderLine(); if (S.l.running) updateTarget(); }
    if (S.naming) renderNameBox();
  }
  btnSound.addEventListener('click', () => { S.sound = !S.sound; store.set('sound', S.sound); syncTools(); if (S.sound) sfx.good(); else hissStop(); });
  btnPlayer.addEventListener('click', () => { if (!S.naming) openName(); });
  btnPrizes.addEventListener('click', () => { if (!S.naming) prizesCard(); });
  btnMenu.addEventListener('click', menuCard);
  const themeChange = () => { snowColors(); if (S.mode === 'snow' && !S.s.running) drawSnow(previewFlakes()); };
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', themeChange); } catch (e) {}
  try { new MutationObserver(themeChange).observe(root, { attributes: true, attributeFilter: ['data-theme'] }); } catch (e) {}

  /* =====================================================================
     TILAT
     ===================================================================== */
  function stopEverything() {
    if (S.w.running) stopRound();
    if (S.s.running) snowStop();
    if (S.l.running) { S.l.running = false; S.l.wait = false; }
    clearInterval(S.l.timer);
    cancelDynamite(); clearTimeout(S.f.hintT); clearHints(); targetKey(null);
  }
  function setMode(m) {
    stopEverything(); hideOverlay();
    S.mode = m; store.set('mode', m); document.body.dataset.mode = m;
    tabs.forEach((t) => t.setAttribute('aria-selected', String(t.dataset.mode === m)));
    letterView.hidden = !(m === 'free' || m === 'find');
    wordView.hidden = m !== 'words';
    lessonView.hidden = m !== 'lesson';
    snowCv.hidden = m !== 'snow';
    markKeys(); renderStats(); specialKeys(); kbClasses();
    if (m === 'free') {
      prompt.textContent = 'Paina mitä tahansa kirjainta tai numeroa';
      if (!S.freeView) S.freeView = { kind: 'letter', ch: 'A', pick: pickFor('A') };
      S.view = S.freeView; renderView(); pop(block);
    } else if (m === 'find') {
      prompt.textContent = 'Etsi tämä kirjain näppäimistöltä';
      S.f.target = null; S.f.streak = 0;
      if (S.p) newTarget(); else { S.view = { kind: 'letter', ch: 'K', pick: PICS.K[0] }; renderView(); }
      updateStats();
    } else if (m === 'words') {
      if (S.p) S.w.level = Math.min(Math.max(1, S.w.level), S.p.level);
      setWordsPrompt();
      if (!S.w.cur) previewWord(); else { S.w.pos = 0; renderTiles(); }
      requestAnimationFrame(setupRace);
      if (S.p) startCard();
    } else if (m === 'snow') {
      snowPrompt();
      snowColors(); drawSnow(previewFlakes());
      if (S.p) snowStartCard();
    } else {
      prompt.textContent = 'Sormikoulu';
      if (S.p && S.l.lesson > S.p.lessonMax) S.l.lesson = S.p.lessonMax;
      lessonPreview();
      if (S.p) { if (!S.p.postureSeen) postureCard('lesson'); else lessonStartCard(); }
    }
  }
  tabs.forEach((t) => t.addEventListener('click', () => { if (S.naming) return; if (!S.p) { openName(); return; } if (t.dataset.mode !== S.mode) setMode(t.dataset.mode); }));

  function readSharedList() {
    try {
      const q = new URLSearchParams(location.search), raw = q.get('sanat');
      if (!raw) return;
      const words = cleanWords(raw.split(','));
      if (!words.length) return;
      const title = (q.get('lista') || 'Viikon sanat').slice(0, 30);
      S.custom = { title, words }; store.set('custom', S.custom); S.w.custom = true; S.listNotice = `${title} (${words.length} sanaa)`;
    } catch (e) {}
  }
  readSharedList();
  window.__naa = { syllables };
  buildHands();
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage); else window.addEventListener('resize', resize);
  resize(); focusState(); syncTools(); keyLabels(); syncPlayer();
  const saved = store.get('mode', 'free');
  setMode(['free', 'find', 'words', 'snow', 'lesson'].includes(saved) ? saved : 'free');
  openName();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) { window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); }); }
})();
</script>
</body>
</html>
